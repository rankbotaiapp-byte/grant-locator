<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grant Finder</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0d1f1a; color: #fff; margin: 0; padding: 20px; }
  h1 { font-size: 22px; }
  .search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
  input { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 16px; }
  button { padding: 12px 20px; border-radius: 8px; border: none; background: #1f9d6f; color: #fff; font-weight: bold; cursor: pointer; }
  .result { background: #142d25; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .result.forecasted { opacity: 0.7; border-left: 3px solid #d9a441; }
  .result.posted { border-left: 3px solid #1f9d6f; }
  .result h3 { margin: 0 0 6px 0; font-size: 16px; }
  .meta { font-size: 13px; color: #9fc9b8; margin-bottom: 4px; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-top: 6px; }
  .status.posted { background: #1f9d6f; }
  .status.forecasted { background: #d9a441; color: #1a1a1a; }
  .status.closed, .status.archived { background: #555; }
  .section-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #9fc9b8; margin: 20px 0 10px 0; }
  a { color: #6ee7b7; }
  #loading { display: none; color: #9fc9b8; }
</style>
</head>
<body>

<h1>Grant Finder</h1>
<div class="search-bar">
  <input id="keyword" type="text" placeholder="e.g. small business, agriculture, veterans" />
  <button onclick="searchGrants()">Search</button>
</div>
<div id="loading">Searching...</div>
<div id="results"></div>

<script>
function renderCard(hit) {
  const status = (hit.oppStatus || 'unknown').toLowerCase();
  const card = document.createElement('div');
  card.className = 'result ' + status;
  card.innerHTML = `
    <h3>${hit.title || 'Untitled Opportunity'}</h3>
    <div class="meta">${hit.agency || 'Unknown Agency'} &middot; Opportunity #${hit.number || 'N/A'}</div>
    <div class="meta">Opens: ${hit.openDate || 'N/A'} &nbsp;|&nbsp; Closes: ${hit.closeDate || 'Rolling / Not listed'}</div>
    <span class="status ${status}">${hit.oppStatus || 'unknown'}</span>
    <div style="margin-top:8px;">
      <a href="https://www.grants.gov/search-results-detail/${hit.id}" target="_blank">View on Grants.gov &rarr;</a>
    </div>
  `;
  return card;
}

async function searchGrants() {
  const keyword = document.getElementById('keyword').value.trim();
  if (!keyword) return;

  const resultsDiv = document.getElementById('results');
  const loading = document.getElementById('loading');
  resultsDiv.innerHTML = '';
  loading.style.display = 'block';

  try {
    const res = await fetch('/api/grants-search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keyword })
    });
    const data = await res.json();
    loading.style.display = 'none';

    const hits = data?.data?.oppHits || [];
    if (hits.length === 0) {
      resultsDiv.innerHTML = '<p>No grants found for that keyword.</p>';
      return;
    }

    const open = hits.filter(h => (h.oppStatus || '').toLowerCase() === 'posted');
    const forecasted = hits.filter(h => (h.oppStatus || '').toLowerCase() === 'forecasted');
    const other = hits.filter(h => !['posted', 'forecasted'].includes((h.oppStatus || '').toLowerCase()));

    resultsDiv.innerHTML = `<p class="meta">${data.data.hitCount} total matches — showing top ${hits.length}</p>`;

    if (open.length) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = `Open now — accepting applications (${open.length})`;
      resultsDiv.appendChild(label);
      open.forEach(h => resultsDiv.appendChild(renderCard(h)));
    }

    if (forecasted.length) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = `Coming soon — not yet accepting applications (${forecasted.length})`;
      resultsDiv.appendChild(label);
      forecasted.forEach(h => resultsDiv.appendChild(renderCard(h)));
    }

    if (other.length) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = `Other (${other.length})`;
      resultsDiv.appendChild(label);
      other.forEach(h => resultsDiv.appendChild(renderCard(h)));
    }

    if (!open.length) {
      resultsDiv.insertAdjacentHTML('beforeend', '<p class="meta">No currently-open opportunities matched — try a broader keyword.</p>');
    }
  } catch (err) {
    loading.style.display = 'none';
    resultsDiv.innerHTML = '<p>Something went wrong. Try again.</p>';
    console.error(err);
  }
}

document.getElementById('keyword').addEventListener('keypress', e => {
  if (e.key === 'Enter') searchGrants();
});
</script>

</body>
</html>
